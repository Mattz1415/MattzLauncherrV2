name: Build MattzLauncher Android APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept All Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystores & Environment (.env)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          rm -f debug.keystore my-upload-key.jks
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass mattzlauncher \
            -alias upload \
            -keypass mattzlauncher \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MattzLauncher,OU=MobileGaming,O=Mattz1415,L=Jakarta,S=ID,C=ID"

      - name: Build Debug & Release APKs with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: mattzlauncher
          KEY_PASSWORD: mattzlauncher
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/MattzLauncher-v1.0.0-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/MattzLauncher-v1.0.0-release.apk
          ls -lh dist/

      - name: Upload MattzLauncher Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MattzLauncher-v1.0.0-debug-apk
          path: dist/MattzLauncher-v1.0.0-debug.apk
          if-no-files-found: error

      - name: Upload MattzLauncher Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MattzLauncher-v1.0.0-release-apk
          path: dist/MattzLauncher-v1.0.0-release.apk
          if-no-files-found: error
